<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Character Board</title>
    <meta name="description" content="A private board for character inspiration." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Characters" />
    <script>
      // Apply the saved theme before anything paints (light is the default)
      try {
        var t = localStorage.getItem('cb-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#111111';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"><div class="loading"><div class="spinner"></div></div></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
